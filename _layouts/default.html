<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="{{ page.description | default: site.description }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- OpenGraph & Twitter Meta Tags -->
    <meta property="og:title" content="{{ page.og_title | default: page.title | default: site.title }}" />
    <meta property="og:description" content="{{ page.og_description | default: page.description | default: site.description }}" />
    <meta property="og:type" content="{{ page.og_type | default: 'website' }}" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:image" content="{{ site.url }}{% if page.image %}{{ page.image }}{% else %}/assets/index/og-default.png{% endif %}" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Additional Meta Tags -->
    <meta name="author" content="{{ site.author }}" />
    <meta name="keywords" content="{{ page.keywords | default: 'software engineering, AI, fintech, startups, technology, personal blog' }}" />
    <meta name="robots" content="index, follow" />
    
    <link rel="canonical" href="{{ site.url }}{{ page.url }}" />
    <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/css/main.css' | absolute_url }}" />
    
    <!-- Favicons -->
    <link rel="icon" href="{{ '/favicon.ico' | absolute_url }}" type="image/x-icon" />
    <link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16x16.png' | absolute_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32x32.png' | absolute_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | absolute_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | absolute_url }}">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" />

    <!-- Font Awesome for Social Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- JSON-LD Structured Data -->
    {% if page.url == '/' %}
    {% include structured-data.html %}
    {% endif %}

    <!-- Privacy-friendly analytics by Plausible -->
    <script async src="https://plausible.io/js/pa-5GRj7cIPbXBLU2TpCNfzR.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="navbar-container">
        <a href="{{ site.baseurl }}/" class="navbar-brand" aria-label="Marc Beepath">
          <img src="{{ '/assets/index/navbar-logo-transparent.png' | relative_url }}" alt="Marc Beepath" height="20">
        </a>

        <div class="navbar-links">
          <a href="/projects" class="nav-link{% if page.url contains '/projects' %} is-active{% endif %}">Projects</a>
          <a href="/writings" class="nav-link{% if page.url contains '/writings' %} is-active{% endif %}">Writings</a>
          <a href="/films" class="nav-link{% if page.url contains '/films' %} is-active{% endif %}">Films</a>
          <a href="/contact" class="nav-link{% if page.url contains '/contact' %} is-active{% endif %}">Contact</a>
        </div>

        <button class="menu-btn" aria-label="Toggle menu" aria-expanded="false" onclick="toggleMenu()">
          <span class="menu-icon-open" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          </span>
          <span class="menu-icon-close" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </span>
        </button>
      </div>

      <div id="menuDropdown" class="menu-dropdown">
        <div class="menu-dropdown-clip">
          <div class="menu-dropdown-content">
            <a href="/projects" class="nav-link{% if page.url contains '/projects' %} is-active{% endif %}">Projects</a>
            <a href="/writings" class="nav-link{% if page.url contains '/writings' %} is-active{% endif %}">Writings</a>
            <a href="/films" class="nav-link{% if page.url contains '/films' %} is-active{% endif %}">Films</a>
            <a href="/contact" class="nav-link{% if page.url contains '/contact' %} is-active{% endif %}">Contact</a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content Container -->
    <div class="container">
      {{ content }}
    </div>

    {% include scripts.html %}
    <script src="{{ '/assets/js/menu.js' | absolute_url }}"></script>
  </body>
</html>
