---
layout: default
---

<article class="writing">
  <header class="writing-header">
    {% if page.date %}
    <time class="writing-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% endif %}

    <h1 class="writing-title">{{ page.title }}</h1>

    {% if page.description %}
    <p class="writing-excerpt">{{ page.description }}</p>
    {% endif %}
  </header>

  {% if page.image %}
  <figure class="writing-banner image-frame">
    <img src="{{ page.image | absolute_url }}" alt="{{ page.title }}" class="writing-banner-image">
    {% if page.image_caption %}<figcaption class="image-caption">{{ page.image_caption }}</figcaption>{% endif %}
  </figure>
  {% endif %}

  <div class="writing-content">
    {{ content }}
  </div>

  {% include post-nav.html %}
</article>
